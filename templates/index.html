{% extends "base.html" %}
{% block title %}Game Highlights{% endblock %}
{% block nav_search %}sidebar-link-active{% endblock %}

{% block content %}
  <div class="hero">
    <h1>Game Highlights</h1>
    <p class="subtitle">Search any MLB game for the full play-by-play story</p>

    <form class="search-form" action="/search" method="get">
      <input
        type="text"
        name="q"
        class="search-input"
        placeholder="e.g. Braves June 3 or Dodgers vs Red Sox June 1 2024"
        autofocus
      >
      <button type="submit" class="search-btn">Search</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
  </div>
{% endblock %}
